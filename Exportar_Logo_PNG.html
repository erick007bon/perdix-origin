<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exporting Logo to 4K PNG</title>
    <script>
        window.onload = function() {
            const svgContent = `<svg viewBox="0 0 450 120" width="4500" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&amp;display=swap');
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 56px; fill: #ffffff; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 20px; fill: #6b7280; letter-spacing: 0.35em; }
    </style>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D4FF" />
      <stop offset="50%" stopColor="#9F4BFF" />
      <stop offset="100%" stopColor="#FF2E9E" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050505" rx="40" />

  <g transform="translate(20, 10)">
    <svg width="100" height="100" viewBox="0 0 100 100">
        <path d="M50 0 L60 35 L85 15 L65 40 L100 50 L65 60 L85 85 L60 65 L50 100 L40 65 L15 85 L35 60 L0 50 L35 40 L15 15 L40 35 Z" stroke="url(#neonGrad)" stroke-width="2" fill="rgba(0, 0, 0, 0.6)" filter="url(#neonGlow)"/>
        <path d="M50 10 L50 90 M10 50 L90 50 M22 22 L78 78 M22 78 L78 22" stroke="url(#neonGrad)" stroke-width="0.5" opacity="0.6"/>
        <g transform="translate(32, 32) scale(0.36)"><path d="M70 20 C 65 15, 60 15, 55 20 C 50 15, 45 20, 45 25 C 45 30, 50 35, 40 40 C 20 50, 10 70, 20 80 L 30 85 L 40 75 L 45 85 L 50 75 C 60 75, 75 65, 80 50 C 85 40, 80 30, 75 25 C 70 20, 75 20, 70 20 Z" fill="url(#neonGrad)" fill-opacity="1" stroke="white" stroke-width="2"/></g>
    </svg>
    <text x="125" y="58" class="title">Perdix</text>
    <text x="128" y="86" class="subtitle">ORIGIN</text>
  </g>
</svg>`;

            const canvas = document.createElement("canvas");
            canvas.width = 4500;
            canvas.height = 1200;
            const ctx = canvas.getContext("2d");
            
            // Wait slightly so Google Fonts load their web font instances
            setTimeout(() => {
                const img = new Image();
                const svg = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svg);
                
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    
                    const a = document.createElement("a");
                    a.download = "Perdix_Origin_Official_Logo_4K.png";
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                    document.getElementById('status').innerText = "✅ Logo 4K PNG descargado. Revisa tu carpeta de Descargas (Downloads).";
                };
                img.src = url;
            }, 1500); 
        };
    </script>
</head>
<body style="background: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 100px;">
    <h2>Cargando tipografía y Renderizando Logo Alta Resolución...</h2>
    <p id="status" style="color: #4ade80;">Por favor espera 2 segundos, la descarga del PNG de 4000x1200 comenzará solita.</p>
</body>
</html>
